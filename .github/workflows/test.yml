name: Test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache-dependency-path: go.sum

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache s3proxy
      uses: actions/cache@v4
      with:
        path: s3proxy.jar
        key: s3proxy-1.8.0

    - name: Cache xfstests
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v4
      with:
        path: xfstests
        key: xfstests-${{ runner.os }}-v1
        restore-keys: |
          xfstests-${{ runner.os }}-

    - name: Build
      shell: bash
      env:
        CGO_ENABLED: "0"
      run: go build -o geesefs -v .

    - name: Run tests
      shell: bash
      env:
        CGO_ENABLED: "0"
        SAME_PROCESS_MOUNT: "1"
        SKIP_FUSE_TESTS: ${{ matrix.os != 'ubuntu-latest' && '1' || '' }}
      run: make run-test
      timeout-minutes: 12

    - name: Run xfstests
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: make run-xfstests
      timeout-minutes: 10

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache-dependency-path: go.sum

    - name: Check formatting
      run: gofmt -l .

    - name: Run go vet
      run: go vet ./...
